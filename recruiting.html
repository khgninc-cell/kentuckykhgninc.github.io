!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHGN Inc. - Unified Recruitment & Training Terminal</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #ffffff; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        .banner { background: #f4f4f4; border-bottom: 2px solid #ddd; padding: 25px; text-align: center; font-size: 26px; font-weight: bold; }
        .container { max-width: 900px; margin: 40px auto; padding: 20px; box-sizing: border-box; width: 100%; }
        .header-box { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 28px; color: #111; margin-bottom: 15px; }
        p { font-size: 16px; line-height: 1.6; color: #555; }
        .portal-section { display: none; }
        .active-section { display: block; }
        .credit-badge-box { background: #f0f7ff; border-left: 4px solid #0056b3; padding: 20px; border-radius: 0 8px 8px 0; margin-bottom: 35px; }
        .form-box { background: #fafafa; border: 1px solid #eee; padding: 35px; border-radius: 8px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; text-transform: uppercase; }
        input[type="text"], input[type="email"], select { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; background: #fff; }
        .submit-btn { width: 100%; padding: 14px; background: #222; color: #fff; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 15px; }
        .submit-btn:hover { background: #444; }
        .lab-layout { display: flex; gap: 20px; margin-top: 20px; }
        .lab-column { flex: 1.2; padding: 20px; border: 1px solid #ddd; border-radius: 6px; background: #fff; }
        .circle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; text-align: center; }
        .sieve-circle { width: 70px; height: 70px; border-radius: 50%; border: 2px dashed #0056b3; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; background: #fdfdfd; color: #0056b3; }
        .console-box { background: #1e1e1e; color: #a9ffb7; font-family: monospace; padding: 15px; border-radius: 4px; height: 100px; overflow-y: auto; font-size: 13px; margin-top: 15px; }
        .game-card { background: #f8f9fa; border: 1px dashed #ccc; border-radius: 6px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .game-title { font-weight: bold; font-size: 15px; color: #222; }
        .launch-btn { padding: 8px 16px; background: #28a745; color: #fff; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold; text-transform: uppercase; }
        .launch-btn:hover { background: #218838; }
        .back-home { display: inline-block; margin-top: 25px; color: #666; text-decoration: none; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="banner">🚗 Kentucky History and Genealogy Network Inc.</div>
    <div class="container">
        <div id="recruitmentGateway" class="portal-section active-section">
            <div class="header-box">
                <h1>Volunteer Recruitment & Research Intake</h1>
                <p>Register below to secure administrative archive clearance and unlock your active training suite.</p>
            </div>
            <div class="credit-badge-box">
                <strong style="color:#0056b3; font-size:17px;">📋 Unified 200-Hour Graduation Track</strong><br>
