<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kentucky History and Genealogy Network Inc. | KHGN</title>
    <style>
        body { font-family: Georgia, serif; background-color: #fdfbf7; color: #2d2d2d; margin: 0; padding: 0; text-align: center; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .hero-box { border: 4px solid #1a365d; border-radius: 12px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .hero-box img { width: 100%; height: auto; display: block; max-height: 450px; object-fit: cover; }
        h1 { color: #1a365d; font-size: 2.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #e2dcd0; text-align: left; }
        .card h2 { color: #1a365d; }
        .badge { background-color: #d97706; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
        .btn { display: inline-block; background: #1a365d; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 5px; margin-top: 10px; }
        .btn-disabled { background: #a1a1a1; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero-box"><img src="images/model-a-1945.jpg" alt="1945 Knox County Model A Automobile Work"></div>
        <h1>Kentucky History and Genealogy Network</h1>
        <div class="grid">
            <div class="card"><h2>Genealogy Hub</h2><a href="#" class="btn">Enter Database</a></div>
            <div class="card"><h2>Educational Games</h2><a href="#" class="btn">Play Online</a></div>
            <div class="card"><span class="badge">Awaiting Accreditation</span><h2>Curriculum Labs</h2><a href="#" class="btn btn-disabled">Coming Soon</a></div>
            <div class="card"><h2>Community Workspace</h2><a href="#" class="btn">Open Workspace</a></div>
        </div>
    </div>
</body>
</html>
